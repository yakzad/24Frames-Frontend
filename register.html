<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>24Frames — Create Account</title>
    <meta name="description" content="Join 24Frames — share reviews, theories and fun facts about the movies you love." />
    <meta name="theme-color" content="#0f1e3a" />
    <meta property="og:site_name" content="24Frames" />
    <meta property="og:title" content="Join 24Frames" />
    <meta property="og:description" content="Share reviews, theories and fun facts about the movies you love." />
    <meta property="og:image" content="https://24frames.app/images/24frames1.png" />
    <meta property="og:url" content="https://24frames.app/register.html" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://24frames.app/images/24frames1.png" />

    <link rel="icon" href="images/favicon.ico" />
    <link rel="stylesheet" href="login.css" />
  </head>

  <body>
    <main class="login-wrapper">
      <section class="login-card">
        <div class="logo">
          <img src="images/24frames1.png" alt="24Frames logo" />
        </div>

        <h1>Create your 24Frames account</h1>

        <p class="subtitle">Join a community built around movies and ideas</p>

        <!-- REGISTER FORM -->
        <form class="login-form" id="registerForm">
          <div class="input-group">
            <input type="text" name="name" placeholder="Name" required />
          </div>

          <div class="input-group">
            <input
              type="text"
              name="username"
              placeholder="Username"
              required
            />
          </div>

          <div class="input-group">
            <input type="email" name="email" placeholder="Email" required />
          </div>

          <div class="input-group">
            <input
              type="password"
              name="password"
              placeholder="Password"
              required
            />
            <button type="button" class="toggle-password">👁</button>
          </div>

          <div class="input-group">
            <input
              type="password"
              name="confirm_password"
              placeholder="Confirm password"
              required
            />
          </div>

          <button type="submit" class="primary-button" id="registerBtn">
            Create account
          </button>
        </form>

        <div class="secondary-links">
          <a href="index.html">Already have an account?</a>
        </div>
      </section>
    </main>

    <script src="register.js?v=2"></script>
  </body>
</html>
