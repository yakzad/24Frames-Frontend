<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
      url="index.html"
    />
    <title>24Frames — Explore Movies Deeper</title>
    <meta name="description" content="Reviews, theories, fun facts and videos about the movies you love — all in one place." />
    <meta name="theme-color" content="#0f1e3a" />
    <meta property="og:site_name" content="24Frames" />
    <meta property="og:title" content="24Frames — Explore Movies Deeper" />
    <meta property="og:description" content="Reviews, theories, fun facts and videos about the movies you love." />
    <meta property="og:image" content="https://24frames.app/images/24frames1.png" />
    <meta property="og:url" content="https://24frames.app" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="24Frames — Explore Movies Deeper" />
    <meta name="twitter:description" content="Reviews, theories, fun facts and videos about the movies you love." />
    <meta name="twitter:image" content="https://24frames.app/images/24frames1.png" />

    <link rel="stylesheet" href="index.css?v=5" />
    <a href="index.html" class="logo-link"> </a>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="app-wrapper">
      <aside class="sidebar">
        <div
          class="sidebar-header sb-profile"
          onclick="location.href='profile.html'"
        >
          <div class="sb-avatar"></div>
          <div class="sb-user">
            <div class="sb-name"></div>
            <div class="sb-handle"></div>
          </div>
        </div>

        <nav class="sidebar-nav">
          <a href="index.html">Home</a>
          <a href="lists.html">My Lists</a>
          <a href="friends.html">Friends</a>
          <a href="reviews.html">My Reviews</a>
          <a href="settings.html">Settings</a>
        </nav>

        <div class="sidebar-footer" id="sidebarFooter">
          <button class="logout-btn" id="logoutBtn">Log out</button>
        </div>
      </aside>

      <!-- Header -->
      <header class="app-header">
        <div class="logo">
          <img src="images/24frames1.png" alt="24Frames logo" />
        </div>
        <form id="searchForm">
          <input
            type="search"
            id="searchInput"
            placeholder="Search movies, actors, directors…"
          />
        </form>
      </header>

      <!-- Main content -->
      <main class="app-content">
        <!-- Hero -->
        <section class="home-hero">
          <h1>Explore movies deeper</h1>
          <p>Reviews, theories and videos — all in one place.</p>
        </section>

        <!-- Trending -->
        <section class="trending-section today">
          <h2 class="section-title">Trending Today</h2>

          <div class="movies-grid" id="trendingGrid"></div>
        </section>
        <button id="showMoreBtn" class="show-more-btn">Show more</button>

        <section class="trending-section week">
          <h2 class="section-title">Trending This Week</h2>
          <p class="muted">Coming soon</p>
        </section>

        <section class="trending-section year">
          <h2 class="section-title">Trending This Year</h2>
          <p class="muted">Coming soon</p>
        </section>
      </main>
    </div>

    <script src="sidebar.js?v=3"></script>
    <script src="index.js?v=6" defer></script>
  </body>
</html>
