<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>24Frames — Log In</title>
    <meta name="description" content="Log in to 24Frames — explore movies deeper with reviews, theories, fun facts and videos." />
    <meta name="theme-color" content="#0f1e3a" />
    <meta property="og:site_name" content="24Frames" />
    <meta property="og:title" content="24Frames — Log In" />
    <meta property="og:description" content="Explore movies deeper — reviews, theories, fun facts and videos all in one place." />
    <meta property="og:image" content="https://24frames.app/images/24frames1.png" />
    <meta property="og:url" content="https://24frames.app/login.html" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://24frames.app/images/24frames1.png" />

    <link rel="stylesheet" href="login.css" />
    <link rel="icon" type="image/png" href="images/24frames1.png" />
  </head>

  <body>
    <main class="login-wrapper">
      <section class="login-card">
        <div class="logo">
          <img src="images/24frames1.png" alt="24Frames logo" />
        </div>

        <h1>Welcome to 24Frames</h1>

        <p class="subtitle">
          Stories, ideas and videos about the movies you love
        </p>

        <form class="login-form" id="loginForm" method="post">
          <div class="input-group">
            <input type="email" name="email" placeholder="Email" required />
          </div>

          <div class="input-group">
            <input
              type="password"
              name="password"
              placeholder="Password"
              required
            />
            <button
              type="button"
              class="toggle-password"
              aria-label="Show password"
            >
              👁
            </button>
          </div>

          <button type="submit" class="primary-button" id="loginBtn">
            Enter 24Frames
          </button>
        </form>

        <div class="secondary-links">
          <a href="register.html">Create account</a>
          <a href="forgot.html">Forgot password</a>
        </div>
      </section>
    </main>
    <script src="login.js?v=4"></script>
  </body>
</html>
