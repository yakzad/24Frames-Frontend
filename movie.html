<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>24Frames — Movie</title>
    <meta name="description" content="Reviews, theories, fun facts and videos for this movie on 24Frames." />
    <meta name="theme-color" content="#0f1e3a" />
    <meta property="og:site_name" content="24Frames" />
    <meta property="og:title" content="24Frames" />
    <meta property="og:description" content="Reviews, theories, fun facts and videos." />
    <meta property="og:image" content="https://24frames.app/images/24frames1.png" />
    <meta property="og:url" content="https://24frames.app/movie.html" />
    <meta property="og:type" content="video.movie" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="24Frames" />
    <meta name="twitter:description" content="Reviews, theories, fun facts and videos." />
    <meta name="twitter:image" content="https://24frames.app/images/24frames1.png" />

    <link rel="stylesheet" href="movie.css?v=17" />
    <link rel="icon" type="image/png" href="images/24frames1.png" />
  </head>

  <body>
    <main class="movie-wrapper">
      <header class="movie-header">
        <button onclick="history.length > 1 ? history.back() : location.href='index.html'">←</button>
        <div>
          <h1 id="movieTitle"></h1>
          <p id="movieMeta"></p>
        </div>
      </header>

      <section class="movie-info">
        <img id="moviePoster" alt="Movie poster" />
        <div>
          <p id="movieDescription"></p>
          <p id="movieRating"></p>
          <div class="movie-actions">
            <button id="favouriteBtn" class="favourite-btn" style="display:none" aria-label="Add to Favourites">♡</button>
            <div class="list-picker-wrap" id="listPickerWrap" style="display:none">
              <button id="addToListBtn" class="add-to-list-btn">+ List</button>
              <div class="list-picker" id="listPicker"></div>
            </div>
            <button id="recommendBtn" class="recommend-btn" style="display:none">Recommend</button>
          </div>
          <div id="ratingWrap" style="display:none" class="rating-wrap">
            <p class="rating-label">Your rating</p>
            <div class="clap-row" id="clapRow">
              <span class="clap" data-score="1">🎬</span>
              <span class="clap" data-score="2">🎬</span>
              <span class="clap" data-score="3">🎬</span>
              <span class="clap" data-score="4">🎬</span>
              <span class="clap" data-score="5">🎬</span>
            </div>
          </div>
        </div>
      </section>

      <nav class="tabs">
        <button class="tab-btn active" data-tab="videos">Videos</button>
        <button class="tab-btn" data-tab="reviews">Reviews</button>
        <button class="tab-btn" data-tab="theories">Theories</button>
        <button class="tab-btn" data-tab="funfacts">Fun Facts</button>
      </nav>

      <section id="videosSection" class="tab-section videos-section"></section>

      <section id="reviewsSection" class="tab-section" style="display:none">
        <form class="post-form" id="reviewForm">
          <textarea name="content" placeholder="Write your review…" required maxlength="2000"></textarea>
          <button type="submit">Post review</button>
        </form>
        <div class="posts-list" id="reviewsList"></div>
        <div class="gate-overlay">
          <p>Log in to read and post reviews</p>
          <a href="login.html" class="gate-btn">Log in</a>
        </div>
      </section>

      <section id="theoriesSection" class="tab-section" style="display:none">
        <form class="post-form" id="theoryForm">
          <textarea name="content" placeholder="Share your theory…" required maxlength="2000"></textarea>
          <button type="submit">Post theory</button>
        </form>
        <div class="posts-list" id="theoriesList"></div>
        <div class="gate-overlay">
          <p>Log in to read and post theories</p>
          <a href="login.html" class="gate-btn">Log in</a>
        </div>
      </section>

      <section id="funfactsSection" class="tab-section" style="display:none">
        <form class="post-form" id="funFactForm">
          <textarea name="content" placeholder="Share a fun fact…" required maxlength="2000"></textarea>
          <button type="submit">Post fun fact</button>
        </form>
        <div class="posts-list" id="funfactsList"></div>
        <div class="gate-overlay">
          <p>Log in to read and post fun facts</p>
          <a href="login.html" class="gate-btn">Log in</a>
        </div>
      </section>
    </main>

    <!-- Recommend modal -->
    <div id="recommendModal" class="modal-overlay" style="display:none" role="dialog" aria-modal="true">
      <div class="modal-box">
        <button class="modal-close" id="recommendClose" aria-label="Close">×</button>
        <h3 class="modal-title">Recommend to a friend</h3>
        <div id="recommendFriendsList" class="recommend-friends-list"></div>
        <textarea id="recommendMsg" class="recommend-msg" placeholder="Add a message… (optional)" maxlength="200"></textarea>
        <button id="recommendSend" class="recommend-send-btn" disabled>Send</button>
        <p id="recommendFeedback" class="recommend-feedback"></p>

        <div class="modal-divider"><span>or share externally</span></div>
        <div class="share-external-row">
          <a id="shareWhatsapp" class="share-external-btn" target="_blank" rel="noopener">WhatsApp</a>
          <a id="shareEmail" class="share-external-btn">Email</a>
          <button id="shareCopy" class="share-external-btn">Copy link</button>
        </div>
      </div>
    </div>

    <script src="movie.js?v=24"></script>
  </body>
</html>
