<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>24Frames — Movie</title>

    <link rel="stylesheet" href="movie.css?v=6" />
    <link rel="icon" href="images/favicon.ico" />
  </head>

  <body>
    <main class="movie-wrapper">
      <header class="movie-header">
        <button onclick="history.back()">←</button>
        <div>
          <h1 id="movieTitle"></h1>
          <p id="movieMeta"></p>
        </div>
      </header>

      <section class="movie-info">
        <img id="moviePoster" alt="Movie poster" />
        <div>
          <p id="movieDescription"></p>
          <p id="movieRating"></p>
          <div class="movie-actions">
            <button id="favouriteBtn" class="favourite-btn" style="display:none" aria-label="Add to Favourites">♡</button>
            <div class="list-picker-wrap" id="listPickerWrap" style="display:none">
              <button id="addToListBtn" class="add-to-list-btn">+ List</button>
              <div class="list-picker" id="listPicker"></div>
            </div>
          </div>
          <div id="ratingWrap" style="display:none" class="rating-wrap">
            <p class="rating-label">Your rating</p>
            <div class="clap-row" id="clapRow">
              <span class="clap" data-score="1">🎬</span>
              <span class="clap" data-score="2">🎬</span>
              <span class="clap" data-score="3">🎬</span>
              <span class="clap" data-score="4">🎬</span>
              <span class="clap" data-score="5">🎬</span>
            </div>
          </div>
        </div>
      </section>

      <nav class="tabs">
        <button class="tab-btn active" data-tab="videos">Videos</button>
        <button class="tab-btn" data-tab="reviews">Reviews</button>
        <button class="tab-btn" data-tab="theories">Theories</button>
        <button class="tab-btn" data-tab="funfacts">Fun Facts</button>
      </nav>

      <section id="videosSection" class="tab-section videos-section"></section>

      <section id="reviewsSection" class="tab-section" style="display:none">
        <form class="post-form" id="reviewForm">
          <textarea name="content" placeholder="Write your review…" required></textarea>
          <button type="submit">Post review</button>
        </form>
        <div class="posts-list" id="reviewsList"></div>
        <div class="gate-overlay">
          <p>Log in to read and post reviews</p>
          <a href="login.html" class="gate-btn">Log in</a>
        </div>
      </section>

      <section id="theoriesSection" class="tab-section" style="display:none">
        <form class="post-form" id="theoryForm">
          <textarea name="content" placeholder="Share your theory…" required></textarea>
          <button type="submit">Post theory</button>
        </form>
        <div class="posts-list" id="theoriesList"></div>
        <div class="gate-overlay">
          <p>Log in to read and post theories</p>
          <a href="login.html" class="gate-btn">Log in</a>
        </div>
      </section>

      <section id="funfactsSection" class="tab-section" style="display:none">
        <form class="post-form" id="funFactForm">
          <textarea name="content" placeholder="Share a fun fact…" required></textarea>
          <button type="submit">Post fun fact</button>
        </form>
        <div class="posts-list" id="funfactsList"></div>
        <div class="gate-overlay">
          <p>Log in to read and post fun facts</p>
          <a href="login.html" class="gate-btn">Log in</a>
        </div>
      </section>
    </main>

    <script src="movie.js?v=8"></script>
  </body>
</html>
