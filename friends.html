<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>24Frames — Friends</title>
    <link rel="stylesheet" href="index.css?v=5" />
    <link rel="stylesheet" href="friends.css?v=1" />
    <link rel="icon" href="images/favicon.ico" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="app-wrapper">
      <aside class="sidebar">
        <div class="sidebar-header sb-profile" onclick="location.href='profile.html'">
          <div class="sb-avatar"></div>
          <div class="sb-user">
            <div class="sb-name"></div>
            <div class="sb-handle"></div>
          </div>
        </div>
        <nav class="sidebar-nav">
          <a href="index.html">Home</a>
          <a href="lists.html">My Lists</a>
          <a href="friends.html" class="active">Friends</a>
          <a href="reviews.html">My Reviews</a>
          <a href="settings.html">Settings</a>
        </nav>
        <div class="sidebar-footer" id="sidebarFooter">
          <button class="logout-btn" id="logoutBtn">Log out</button>
        </div>
      </aside>

      <main class="app-content">
        <h2 class="section-title">Friends</h2>

        <div class="friends-search-wrap">
          <input
            type="search"
            id="userSearchInput"
            class="friends-search-input"
            placeholder="Search users by name or username…"
            autocomplete="off"
          />
        </div>

        <section id="searchResultsSection" style="display:none">
          <h3 class="friends-section-label">Search Results</h3>
          <div id="searchResults" class="user-cards"></div>
        </section>

        <section id="followingSection">
          <h3 class="friends-section-label">Following</h3>
          <div id="followingList" class="user-cards"></div>
        </section>
      </main>
    </div>

    <script src="sidebar.js?v=3"></script>
    <script src="friends.js?v=1"></script>
  </body>
</html>
